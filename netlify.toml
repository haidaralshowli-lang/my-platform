# النشر على Netlify (قاعدة البيانات على Supabase). راجع DEPLOYMENT.md
[build]
  # الترحيلات والتهيئة الأولى ثم البناء؛ راجع الملف لمعاني أكواد الخروج
  command = "sh scripts/netlify-build.sh"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
