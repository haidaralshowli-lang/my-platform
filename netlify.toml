# النشر على Netlify (قاعدة البيانات على Supabase). راجع DEPLOYMENT.md
[build]
  # مع DIRECT_DATABASE_URL (سياق الإنتاج فقط): ترحيلات + بيانات أساسية + تهيئة أولى متساوية القوى، ثم البناء.
  # بيئات المعاينة بلا هذا المتغير تبني فقط ولا تمس قاعدة البيانات.
  command = "if [ -n \"$DIRECT_DATABASE_URL\" ]; then npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx scripts/bootstrap.ts; fi && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
